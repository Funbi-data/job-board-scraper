name: Sunday Job Scraper

on:
  schedule:
    - cron: '0 8 * * 0'

  workflow_dispatch:

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python job_scraper.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: sunday-job-results
          path: "*.csv"
          Commit changes
                
